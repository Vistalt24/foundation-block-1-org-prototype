  }

  function roleGatedButtonDropdown(label, act, allowed, dangerous) {
    if (!allowed) return '<button class="dropdown-panel__item" disabled>🔒 ' + label + "</button>";
    return '<button class="dropdown-panel__item' + (dangerous ? "" : "") + '" data-act="' + act + '" style="' + (dangerous ? "color:var(--f-danger);" : "") + '">' + label + "</button>";
  }

  function bindNodePanelHandlers(id) {
    const panel = document.getElementById("contextPanelBody");
    const moreBtn = document.getElementById("moreActionsBtn");
    if (moreBtn) moreBtn.addEventListener("click", (ev) => { ev.stopPropagation(); document.getElementById("moreActionsDropdown").classList.toggle("hidden"); });
    panel.querySelectorAll("[data-act]").forEach((btn) => btn.addEventListener("click", () => {
      const act = btn.dataset.act;
      if (act === "addChild") openAddNodeModal(id, null);
      if (act === "addTeamInProject") openAddNodeModal(id, "team");
      if (act === "rename") openRenameModal(id);
      if (act === "changeType") openChangeTypeModal(id);
      if (act === "setManager") openManagerModal(id, false);
      if (act === "setActing") openManagerModal(id, true);
      if (act === "reparent") openReparentModal(id);
      if (act === "addEmployee") openAddEmployeeModal(id);
      if (act === "archive") openArchiveModal(id);
      if (act === "history") openHistoryModal(id);
    }));
    panel.querySelectorAll("[data-emp-id]").forEach((row) => row.addEventListener("click", () => selectStructureObject("emp:" + row.dataset.empId)));
  }

  function contextPanelEmployee(empId) {
    const e = employees[empId];
    if (!e) return '<div class="empty-note">Сотрудник не найден.</div>';
    const primary = e.primaryNodeId ? nodes[e.primaryNodeId] : null;
    const effId = effectivePrimary(empId);
    const isOverride = e.override && e.override.active;
    let html = '<div class="chip chip--accent">Сотрудник</div><div class="context-panel__title">' + escapeHtml(e.name) + "</div>";
    html += '<div style="color:var(--text-secondary);font-size:12.5px;margin-bottom:10px;">' + escapeHtml(e.title || "") + "</div>";
    html += '<div class="info-grid" style="grid-template-columns:1fr;">';
    html += infoItem("Основное подразделение", primary ? escapeHtml(primary.name) : '<span class="muted">не назначено (Требуют назначения)</span>');
    html += infoItem("Дополнительные связи", e.secondaryNodeIds.length ? e.secondaryNodeIds.map((id) => escapeHtml(nodes[id].name)).join(", ") : '<span class="muted">нет</span>');
    if (isOverride) html += infoItem("Временное основное назначение", escapeHtml(nodes[e.override.tempNodeId].name) + '<div class="date-range" style="color:var(--text-muted);margin-top:2px;">' + fmtDate(e.override.startDate) + " – " + fmtDate(e.override.endDate) + "</div>");
    html += infoItem("Текущая роль (демо)", '<span class="chip chip--role">' + ROLE_LABELS[state.currentRole] + " просматривает</span>");
    html += "</div>";

    html += '<div class="context-panel__actions">';
    if (isOverride) {
      html += roleGatedButton("Завершить временный период", 'data-emp-act="endOverride"', currentCaps().manageEmployees, true);
    } else {
      html += roleGatedButton("Переместить (сменить Primary)", 'data-emp-act="move"', currentCaps().manageEmployees);
      html += roleGatedButton("Добавить проектную связь (Secondary)", 'data-emp-act="addSecondary"', currentCaps().manageEmployees);
      html += roleGatedButton("Временное основное назначение", 'data-emp-act="tempPrimary"', currentCaps().manageEmployees);
    }
    if (!primary) html += roleGatedButton("Назначить основную принадлежность", 'data-emp-act="assignUnassigned"', currentCaps().manageEmployees);

  function bindEmployeePanelHandlers(empId) {
    const panel = document.getElementById("contextPanelBody");
    panel.querySelectorAll("[data-emp-act]").forEach((btn) => btn.addEventListener("click", () => {
      const act = btn.dataset.empAct;
      if (act === "move") openMoveEmployeeModal(empId);
      if (act === "addSecondary") openAddSecondaryModal(empId);
      if (act === "tempPrimary") openTempPrimaryModal(empId, effectivePrimary(empId));
      if (act === "endOverride") { endOverride(empId); renderMainContent(); showToast("Временный период завершён — сотрудник вернулся на постоянное место"); }
      if (act === "assignUnassigned") openAssignUnassignedModal(empId);
    }));
  }

  function contextPanelUnassigned() {
    let html = '<div class="chip chip--unassigned">Системная зона</div><div class="context-panel__title">Требуют назначения</div>';
    html += '<div style="color:var(--text-secondary);font-size:12.5px;margin-bottom:10px;">Это не подразделение — у зоны нет руководителя и обычной parent/child логики.</div>';
    html += '<div class="context-panel__actions">' + roleGatedButton("+ Новый сотрудник без назначения", 'data-act="addUnassigned"', currentCaps().manageEmployees) + "</div>";
    const list = unassignedEmployees();
    html += '<div style="font-family:var(--font-display);font-weight:600;font-size:14px;margin:14px 0 8px;">Сотрудники (' + list.length + ")</div>";
    if (!list.length) html += '<div class="empty-note">Никого нет.</div>';
    list.forEach((e) => { html += '<div class="person-row" data-emp-id="' + e.id + '" style="margin-bottom:6px;"><div class="avatar" style="background:var(--f-unassigned-soft);color:var(--f-unassigned);">' + initials(e.name) + '</div><div><div class="person-row__name">' + escapeHtml(e.name) + '</div><div class="person-row__title">' + escapeHtml(e.unassignedReason || "") + "</div></div></div>"; });
    return html;
  }
  function bindUnassignedPanelHandlers() {
    const panel = document.getElementById("contextPanelBody");
    panel.querySelectorAll("[data-act='addUnassigned']").forEach((btn) => btn.addEventListener("click", () => openAddEmployeeModal(null)));
    panel.querySelectorAll("[data-emp-id]").forEach((row) => row.addEventListener("click", () => selectStructureObject("emp:" + row.dataset.empId)));
  }

  function openHistoryModal(id) {
    openModal("История — «" + nodes[id].name + "»", '<p>Полная история изменений появится после подключения журнала событий Foundation Core. В этой версии прототипа история не хранится отдельно — статус «Архив» уже сохраняет узел вместо удаления (History Preservation).</p><div class="btn-row"><button class="btn" id="cancelBtn">Закрыть</button></div>');
    document.getElementById("cancelBtn").addEventListener("click", closeModal);
  }

  /* =========================================================
     11. DRAG & DROP (§8) — тот же результат, что действия карточки,
     просто более наглядный путь к тем же mutation-функциям.
     ========================================================= */
  const dragState = { type: null, id: null, validTargets: null };

  function computeValidNodeTargets(nodeId) {
    const forbidden = new Set(subtreeIds(nodeId));
    return new Set(activeNodesFlat().map((r) => r.id).filter((id) => nodes[id].status !== "archived" && !forbidden.has(id)));
  }
  function computeValidEmployeeTargets(empId) {
    const current = effectivePrimary(empId);
    return new Set(activeNodesFlat().map((r) => r.id).filter((id) => nodes[id].status !== "archived" && id !== current));
  }
  function dragIndicatorEl() { return document.getElementById("dragIndicator"); }

  function startDrag(type, id, label) {
    dragState.type = type; dragState.id = id;
    dragState.validTargets = type === "node" ? computeValidNodeTargets(id) : computeValidEmployeeTargets(id);
    document.body.classList.add("dnd-active");
    document.querySelectorAll(".tree-row[data-node-id], .map-block[data-map-node]").forEach((row) => {
      const t = row.dataset.nodeId || row.dataset.mapNode;
      row.classList.toggle("drop-zone-valid", dragState.validTargets.has(t));
      row.classList.toggle("drop-zone-invalid", !dragState.validTargets.has(t));
    });
    const el = dragIndicatorEl();
    el.textContent = "✥ " + label;
    el.classList.remove("hidden", "forbidden");
  }
  function endDrag() {
    dragState.type = null; dragState.id = null; dragState.validTargets = null;
    document.body.classList.remove("dnd-active");
    document.querySelectorAll(".tree-row, .map-block").forEach((row) => row.classList.remove("drop-zone-valid", "drop-zone-invalid", "drop-target-active", "is-dragging"));
    document.querySelectorAll(".person-row").forEach((row) => row.classList.remove("is-dragging"));
    dragIndicatorEl().classList.add("hidden");
  }
  document.addEventListener("dragover", (ev) => { if (!dragState.type) return; const el = dragIndicatorEl(); el.style.left = ev.clientX + "px"; el.style.top = ev.clientY + "px"; });
  function onDragEnd() { endDrag(); }
  function onNodeDragStart(ev, nodeId) {
    ev.stopPropagation(); ev.dataTransfer.effectAllowed = "move";
    try { ev.dataTransfer.setData("text/plain", nodeId); } catch {}
    ev.currentTarget.classList.add("is-dragging");
    startDrag("node", nodeId, "Переносим: «" + nodes[nodeId].name + "»");
  }
  function onEmployeeDragStart(ev, empId) {
    ev.stopPropagation(); ev.dataTransfer.effectAllowed = "move";
    try { ev.dataTransfer.setData("text/plain", empId); } catch {}
    ev.currentTarget.classList.add("is-dragging");
    startDrag("employee", empId, "Переносим сотрудника: «" + employees[empId].name + "»");
  }
  function onRowDragOver(ev, row, targetId) {
    if (!dragState.type) return;
    ev.preventDefault();
    const valid = dragState.validTargets.has(targetId);
    ev.dataTransfer.dropEffect = valid ? "move" : "none";
    row.classList.toggle("drop-target-active", valid);
    const el = dragIndicatorEl();
    el.classList.toggle("forbidden", !valid);
    if (dragState.type === "node") el.textContent = valid ? "✥ Переносим: «" + nodes[dragState.id].name + "» → в «" + nodes[targetId].name + "»" : "✕ Нельзя переместить «" + nodes[dragState.id].name + "» сюда (это его собственная ветка)";
    else el.textContent = "✥ Переносим сотрудника: «" + employees[dragState.id].name + "» → в «" + nodes[targetId].name + "»";
  }
  function onRowDrop(ev, row, targetId) {
    if (!dragState.type) return;
    ev.preventDefault();
    row.classList.remove("drop-target-active");
    const valid = dragState.validTargets.has(targetId);
    const { type, id } = dragState;
    endDrag();
    if (!valid) return;
    if (type === "node") { if (nodes[id].parentId === targetId) return; openConfirmMoveNodeModal(id, targetId); }
    else openConfirmMoveEmployeeModal(id, targetId);
  }

  function openConfirmMoveNodeModal(nodeId, targetId) {
    const n = nodes[nodeId], target = nodes[targetId];
    const childCount = subtreeIds(nodeId).length - 1;
    const peopleCount = subtreeIds(nodeId).reduce((acc, sid) => acc + employeesPrimaryAt(sid).length, 0);
    let body = "<p>Переместить «" + escapeHtml(n.name) + "» из «" + escapeHtml(nodes[n.parentId].name) + "» в «" + escapeHtml(target.name) + "»?</p>";
    if (childCount > 0 || peopleCount > 0) {
      body += '<div class="impact-box"><h4>Это затронет</h4><ul>' + (childCount > 0 ? "<li>дочерних узлов: " + childCount + "</li>" : "") + (peopleCount > 0 ? "<li>сотрудников (по основной принадлежности): " + peopleCount + "</li>" : "") + "</ul></div>";
    }

  function nodePickerOptions(excludeIds, selectedId) {
    excludeIds = excludeIds || [];
    return activeNodesFlat().filter((row) => nodes[row.id].status !== "archived" && !excludeIds.includes(row.id))
      .map((row) => '<option value="' + row.id + '"' + (row.id === selectedId ? " selected" : "") + ">" + "—".repeat(row.depth) + " " + escapeHtml(nodes[row.id].name) + "</option>").join("");
  }
  function employeePickerOptions(selectedId) {
    return allEmployees().slice().sort((a, b) => a.name.localeCompare(b.name)).map((e) => {
      const home = e.primaryNodeId ? nodes[e.primaryNodeId].name : "Не назначен";
      return '<option value="' + e.id + '"' + (e.id === selectedId ? " selected" : "") + ">" + escapeHtml(e.name) + " — " + escapeHtml(home) + "</option>";
    }).join("");
  }

  function downloadCsvTemplate() {
    const csv = "Имя,Должность,Подразделение\nИван Иванов,Менеджер по продажам,Отдел продаж\n";
    const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "foundation_import_template.csv";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  let pendingImportRows = null;
  function handleCsvFileSelected(ev) {
    const file = ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const text = String(reader.result).replace(/^﻿/, "");
      const lines = text.split(/\r?\n/).filter((l) => l.trim());
      const header = (lines.shift() || "").split(",").map((h) => h.trim().toLowerCase());
      const idxName = header.indexOf("имя"), idxTitle = header.indexOf("должность"), idxDept = header.indexOf("подразделение");
      const errors = [];
      if (idxName === -1) errors.push('Не найдена колонка "Имя"');
      const rows = lines.map((l) => l.split(","));
      const preview = rows.map((cols) => ({ name: (cols[idxName] || "").trim(), title: (cols[idxTitle] || "").trim(), dept: (cols[idxDept] || "").trim() }));
      pendingImportRows = { file, preview, errors };
      renderImportPreview();
    };
    reader.readAsText(file, "UTF-8");
  }
  function renderImportPreview() {
    const area = document.getElementById("importPreviewArea");
    if (!pendingImportRows) { area.innerHTML = ""; return; }
    const { preview, errors, file } = pendingImportRows;
    let html = '<div class="impact-box"><h4>Предварительный просмотр (' + preview.length + " строк)</h4>";
    if (errors.length) html += errors.map((e) => '<p style="color:var(--f-danger);margin:0 0 6px;">⚠ ' + escapeHtml(e) + "</p>").join("");
    html += '<table class="log-table"><thead><tr><th>Имя</th><th>Должность</th><th>Подразделение</th><th>Итог</th></tr></thead><tbody>';
    preview.slice(0, 20).forEach((r) => {
      const match = allNodes().find((n) => n.name.toLowerCase() === r.dept.toLowerCase() && n.status !== "archived");
      html += "<tr><td>" + escapeHtml(r.name || "—") + "</td><td>" + escapeHtml(r.title || "—") + "</td><td>" + escapeHtml(r.dept || "—") + "</td><td>" + (match ? '<span class="chip chip--good">' + escapeHtml(match.name) + "</span>" : '<span class="chip chip--unassigned">Требуют назначения</span>') + "</td></tr>";
    });
    html += "</tbody></table></div>";
    html += '<div class="btn-row"><button class="btn btn--primary" id="confirmImportBtn" ' + (errors.length ? "disabled" : "") + '>Подтвердить импорт (' + preview.length + ')</button><button class="btn" id="cancelImportBtn">Отмена</button></div>';
    area.innerHTML = html;
    document.getElementById("cancelImportBtn").addEventListener("click", () => { pendingImportRows = null; document.getElementById("csvFileInput").value = ""; renderImportPreview(); });
    const confirmBtn = document.getElementById("confirmImportBtn");
    if (confirmBtn) confirmBtn.addEventListener("click", () => {
      preview.forEach((r) => {
        if (!r.name) return;
        const match = allNodes().find((n) => n.name.toLowerCase() === r.dept.toLowerCase() && n.status !== "archived");
        createEmployee({ name: r.name, title: r.title, primaryNodeId: match ? match.id : null, reason: "Импортирован(а) из " + file.name + ", отдел не найден" });
      });
      state.importLog.unshift({ filename: file.name, at: new Date().toISOString(), rows: preview.length, status: "Импортировано" });
      pendingImportRows = null;
      document.getElementById("csvFileInput").value = "";
      renderMainContent();
      showToast("Импортировано " + preview.length + " строк");
    });
  }

  const HELP_CONTRACTS = {

    setManager: { title: "Назначить руководителя", where: "Карточка узла → «Назначить руководителя»", who: "Владелец, Администратор структуры, HR, Руководитель подразделения", does: "Привязывает сотрудника как руководителя узла.", changes: "Пропадает предупреждение Vacant Lead, если оно было.", dangerous: false, confirm: false, result: "Руководитель отображается в карточке узла.", errors: "—" },
    moveEmployee: { title: "Переместить сотрудника", where: "Карточка сотрудника → «Переместить», либо перетаскивание", who: "Владелец, Администратор структуры, HR, Руководитель подразделения", does: "Меняет основную принадлежность (Primary) сотрудника.", changes: "Сотрудник пропадает из старого узла и появляется в новом — сразу и в Рабочем виде, и на Карте.", dangerous: false, confirm: false, result: "Сотрудник виден в новом узле.", errors: "—" },
    archive: { title: "Архивировать узел", where: "Карточка узла → Ещё → «Архивировать»", who: "Владелец, Администратор структуры", does: "Закрывает узел (и, при выборе, всю ветку), сохраняя историю — без удаления.", changes: "Показывает Impact Preview: какие дочерние узлы и сотрудники затронуты, до подтверждения.", dangerous: true, confirm: true, result: "Узел помечен «Архив», сотрудники без другого места — в «Требуют назначения».", errors: "Нельзя архивировать компанию целиком." },
  };
  const ASSISTANT_FAQ = [
    { q: "Где добавить сотрудника?", a: () => "В модуле «Структура» откройте нужный узел (клик в дереве или на карте) и нажмите «+ Добавить сотрудника» в контекстной панели справа." },
    { q: "Что делает кнопка «Архивировать»?", a: () => helpContractAnswer("archive") },
    { q: "Как назначить руководителя?", a: () => helpContractAnswer("setManager") },
    { q: "Почему у отдела предупреждение?", a: () => "Скорее всего это Vacant Lead — у подразделения нет руководителя. Откройте карточку узла и назначьте руководителя или временного И.О." },
    { q: "У меня ошибка при сохранении", a: () => {

  function toggleAssistant(forceOpen) {
    state.assistantOpen = forceOpen !== undefined ? forceOpen : !state.assistantOpen;
    renderAssistant();
  }
  function renderAssistant() {
    const panel = document.getElementById("assistantPanel");
    panel.classList.toggle("hidden", !state.assistantOpen);
    if (!state.assistantOpen) return;
    const ctx = buildDiagnosticContext();
    let html = '<div class="assistant-panel__head"><h3>💬 Помощник</h3><button class="context-panel__close" id="assistantCloseBtn" style="color:var(--white-soft)">×</button></div>';
    html += '<div class="assistant-context">Экран: ' + SECTION_TITLES[ctx.screenId] + " · Роль: " + ROLE_LABELS[ctx.role] + (ctx.objectId ? " · Объект: " + describeObjectId(ctx.objectId) : "") + "</div>";
    html += '<div class="assistant-body" id="assistantBody">';
    if (!state.assistantThread.length) html += '<div class="assistant-msg">Здравствуйте! Я вижу, где вы находитесь, и могу объяснить, что делает любая кнопка, что произойдёт после действия и как исправить ошибку. Выберите вопрос ниже.</div>';
    state.assistantThread.forEach((m) => { html += '<div class="assistant-msg' + (m.from === "user" ? " from-user" : "") + '">' + escapeHtml(m.text).replace(/\n/g, "<br>") + "</div>"; });
    html += "</div>";
    html += '<div class="assistant-quick" id="assistantQuick">';
    ASSISTANT_FAQ.forEach((item, i) => { html += '<button class="btn btn--sm" data-faq="' + i + '">' + escapeHtml(item.q) + "</button>"; });
    html += '</div>';
    panel.innerHTML = html;
    document.getElementById("assistantCloseBtn").addEventListener("click", () => toggleAssistant(false));
    panel.querySelectorAll("[data-faq]").forEach((btn) => btn.addEventListener("click", () => askAssistant(Number(btn.dataset.faq))));
  }
  function describeObjectId(id) {
    if (id === UNASSIGNED) return "Требуют назначения";
    if (String(id).startsWith("emp:")) return employees[id.slice(4)] ? employees[id.slice(4)].name : id;
    return nodes[id] ? nodes[id].name : id;
  }
  function askAssistant(i) {
    const item = ASSISTANT_FAQ[i];
    state.assistantThread.push({ from: "user", text: item.q });
    const answer = item.a();
    state.assistantThread.push({ from: "bot", text: answer, offerEscalate: item.offerEscalate });
    renderAssistant();
    const body = document.getElementById("assistantBody");
    if (item.offerEscalate) {
      const btn = document.createElement("button");
      btn.className = "btn btn--sm btn--primary"; btn.style.margin = "4px 0 8px"; btn.textContent = "Это не помогло → передать в Техподдержку";
      btn.addEventListener("click", () => {
        const ctx = buildDiagnosticContext({ actionId: "assistant_escalation" });
        createSupportCase("Эскалация из Помощника: " + item.q, answer, ctx.errorRefId);
        toggleAssistant(false);
        navigate("support");
        showToast("Обращение создано и передано в Техподдержку");
      });
      body.appendChild(btn);
    }
    body.scrollTop = body.scrollHeight;
  }

  document.getElementById("assistantTopBtn").addEventListener("click", () => toggleAssistant());

    dd.innerHTML = html;
    dd.querySelectorAll("[data-role]").forEach((btn) => btn.addEventListener("click", () => { state.currentRole = btn.dataset.role; closeAllDropdowns(); renderShell(); showToast("Демо-роль: " + ROLE_LABELS[state.currentRole]); }));
    dd.querySelectorAll("[data-nav-item]").forEach((btn) => btn.addEventListener("click", () => { closeAllDropdowns(); navigate(btn.dataset.navItem); }));
  }
  document.getElementById("profileBtn").addEventListener("click", (e) => { e.stopPropagation(); const dd = document.getElementById("profileDropdown"); const willOpen = dd.classList.contains("hidden"); closeAllDropdowns(); if (willOpen) { renderProfileDropdown(); dd.classList.remove("hidden"); } });
  document.addEventListener("click", (e) => { if (!e.target.closest(".dropdown-panel") && !e.target.closest(".lang-switcher") && !e.target.closest("#notifBtn") && !e.target.closest("#profileBtn")) closeAllDropdowns(); });

  /* =========================================================
     18. ИНИЦИАЛИЗАЦИЯ
     ========================================================= */
  function init() {
    state.currentUserId = Object.values(employees).find((e) => e.title === "Генеральный директор").id;
    navigate("dashboard");
  }
  init();

  window.__proto = {
    nodes, employees, state, N, UNASSIGNED, ROLE_CAPS, ROLE_LABELS,
    navigate, selectStructureObject, switchWorkingSubView, goToMapScreen, returnToWorkingView,
    reparent, moveEmployeePrimary, addSecondaryLink, effectivePrimary, subtreeIds, depthOf,
    renderMainContent, renderShell, toggleAssistant, askAssistant, ASSISTANT_FAQ, createSupportCase,
    vacantLeadNodes, unassignedEmployees, currentCaps,
  };
})();
</script>
