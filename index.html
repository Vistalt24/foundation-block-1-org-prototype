<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Foundation — Стройсервис</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  /* ==========================================================
     Foundation design tokens.
     Base palette = confirmed Student Brandbook values (unchanged).
     Tokens marked "Foundation — new" below did not exist in the
     Student palette and were added here (never hardcoded ad hoc)
     because the UI needed a semantic slot the brandbook didn't cover
     (danger/warn/good states, a distinct Smart Unassigned hue).
     ========================================================== */
  :root {
    --bg-page: #F3EEE5;
    --bg-surface: #F8F4EE;
    --bg-sidebar: #DCE2D8;
    --bg-soft: #ECE8E1;
    --white-soft: #FAF7F2;
    --text-primary: #223633;
    --text-secondary: #7B857E;
    --text-muted: #9EA49D;
    --border-soft: #E2DFD7;
    --border-card: #E8E3DA;
    --accent-green: #253936;
    --accent-green-2: #2D433F;
    --accent-sage: #DCE2D8;
    --accent-terra: #D3A38C;
    --accent-terra-strong: #C27B5C;
    --accent-ochre: #D1A472;

    /* Foundation — new (semantic states the Student palette had no slot for) */
    --f-danger: #A8453A;
    --f-danger-soft: #F1DFDA;
    --f-warn: #C27B5C;
    --f-warn-soft: #F3E7D4;
    --f-good: #5C8A70;
    --f-good-soft: #E3EBE4;
    --f-unassigned: #8B7FA0;
    --f-unassigned-soft: #EAE6F0;

    --radius-sm: 7px;
    --radius-md: 11px;
    --radius-lg: 16px;
    --shadow-card: 0 1px 2px rgba(34,54,51,0.05), 0 4px 16px rgba(34,54,51,0.07);
    --shadow-pop: 0 8px 32px rgba(34,54,51,0.16);

    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  }

  /* Brandbook is a fixed warm-light palette, not designed to invert —
     single-theme by deliberate choice, background/colors always explicit. */

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg-page); color: var(--text-primary);
    font-family: var(--font-body); font-size: 14.5px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  *:focus-visible { outline: 2px solid var(--accent-terra-strong); outline-offset: 2px; }
  ::selection { background: var(--accent-terra); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border-card); border-radius: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  .hidden { display: none !important; }

  /* ---------------- Shell ---------------- */
  .shell { display: flex; flex-direction: column; height: 100vh; min-height: 600px; }

  .topbar {
    display: flex; align-items: center; gap: 14px; padding: 0 18px; height: 56px; flex-shrink: 0;
    background: var(--bg-surface); border-bottom: 1px solid var(--border-soft); z-index: 40; position: relative;
  }
  .icon-btn {
    width: 34px; height: 34px; border-radius: var(--radius-sm); border: 1px solid transparent; background: transparent;
    display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; color: var(--text-primary); position: relative; flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--bg-soft); }
  .topbar__section-title { font-family: var(--font-display); font-weight: 600; font-size: 16.5px; letter-spacing: -0.01em; white-space: nowrap; }
  .topbar__org {
    display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: var(--bg-soft);
    font-size: 12.5px; font-weight: 500; color: var(--text-secondary); white-space: nowrap;
  }
  .topbar__spacer { flex: 1; }
  .topbar__right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .badge-dot {
    position: absolute; top: 4px; right: 4px; min-width: 15px; height: 15px; padding: 0 3px; border-radius: 999px;
    background: var(--f-danger); color: var(--white-soft); font-size: 9.5px; font-weight: 700; display: flex; align-items: center; justify-content: center;
  }
  .status-chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .status-chip.active { background: var(--f-good-soft); color: var(--f-good); }
  .status-chip.paused { background: var(--f-warn-soft); color: var(--f-warn); }
  .status-chip.maintenance { background: var(--f-danger-soft); color: var(--f-danger); }
  .status-chip__dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .lang-switcher { position: relative; }
  .lang-switcher__btn { display: flex; align-items: center; gap: 5px; padding: 6px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border-soft); background: var(--bg-surface); font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .lang-switcher__btn:hover { background: var(--bg-soft); }

  .dropdown-panel {
    position: absolute; top: calc(100% + 8px); right: 0; background: var(--white-soft); border: 1px solid var(--border-card);
    border-radius: var(--radius-md); box-shadow: var(--shadow-pop); min-width: 230px; z-index: 60; overflow: hidden;
  }
  .dropdown-panel__item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 10px 14px; border: none; background: none; cursor: pointer; font-size: 13px; }
  .dropdown-panel__item:hover { background: var(--bg-soft); }
  .dropdown-panel__item[disabled] { opacity: .5; cursor: not-allowed; }
  .dropdown-panel__item.selected { font-weight: 600; color: var(--accent-green-2); }
  .dropdown-panel__divider { height: 1px; background: var(--border-soft); margin: 4px 0; }
  .dropdown-panel__label { padding: 8px 14px 4px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); }

  .avatar-chip {
    width: 30px; height: 30px; border-radius: 50%; background: var(--accent-terra); color: var(--white-soft);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; cursor: pointer; flex-shrink: 0;
  }

  /* ---------------- Body: sidebar + main ---------------- */
  .shell-body { flex: 1; display: flex; min-height: 0; position: relative; }

  .sidebar {
    width: 232px; flex-shrink: 0; background: var(--bg-sidebar); border-right: 1px solid var(--border-soft);
    display: flex; flex-direction: column; overflow-y: auto; transition: width .18s ease, opacity .18s ease, padding .18s ease;
  }
  .sidebar.collapsed { width: 0; opacity: 0; overflow: hidden; border-right: none; }
  .sidebar__brand { padding: 18px 18px 14px; }
  .sidebar__brand-name { font-family: var(--font-display); font-weight: 600; font-size: 17px; }
  .sidebar__brand-sub { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); }
  .nav-list { list-style: none; margin: 0; padding: 6px 10px; display: flex; flex-direction: column; gap: 2px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: var(--radius-sm); cursor: pointer;
    font-size: 13.5px; font-weight: 500; color: var(--text-primary); border: none; background: none; width: 100%; text-align: left;
  }
  .nav-item:hover { background: var(--bg-soft); }
  .nav-item.active { background: var(--accent-green-2); color: var(--white-soft); }
  .nav-item__icon { width: 18px; text-align: center; flex-shrink: 0; }
  .sidebar__foot { margin-top: auto; padding: 14px 18px; font-size: 11px; color: var(--text-muted); }

  .main { flex: 1; min-width: 0; overflow-y: auto; position: relative; }
  .main-inner { max-width: 1180px; margin: 0 auto; padding: 26px 30px 60px; }
  .main-inner.wide { max-width: none; padding: 0; }

  .page-head { margin-bottom: 22px; }
  .page-head h1 { font-family: var(--font-display); font-size: 26px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
  .page-head p { margin: 0; color: var(--text-secondary); font-size: 13.5px; }

  /* ---------------- Cards / general ---------------- */
  .card { background: var(--bg-surface); border: 1px solid var(--border-card); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); }
  .btn {
    border: 1px solid var(--border-card); background: var(--bg-surface); color: var(--text-primary); padding: 8px 15px;
    border-radius: var(--radius-sm); font-weight: 600; font-size: 13px; cursor: pointer; transition: background .12s ease, border-color .12s ease;
  }
  .btn:hover { background: var(--bg-soft); }
  .btn--sm { padding: 6px 11px; font-size: 12px; border-radius: 7px; }
  .btn--xs { padding: 3px 8px; font-size: 11px; border-radius: 6px; }
  .btn--primary { background: var(--accent-terra-strong); border-color: var(--accent-terra-strong); color: var(--white-soft); }
  .btn--primary:hover { filter: brightness(1.06); }
  .btn--dark { background: var(--accent-green-2); border-color: var(--accent-green-2); color: var(--white-soft); }
  .btn--dark:hover { filter: brightness(1.15); }
  .btn--danger { border-color: var(--f-danger); color: var(--f-danger); background: transparent; }
  .btn--danger:hover { background: var(--f-danger-soft); }
  .btn--ghost { border-color: transparent; background: transparent; }
  .btn--ghost:hover { background: var(--bg-soft); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; }
  .chip--accent { background: var(--accent-sage); color: var(--accent-green-2); }
  .chip--terra { background: var(--f-warn-soft); color: var(--accent-terra-strong); }
  .chip--good { background: var(--f-good-soft); color: var(--f-good); }
  .chip--warn { background: var(--f-warn-soft); color: var(--f-warn); }
  .chip--danger { background: var(--f-danger-soft); color: var(--f-danger); }
  .chip--unassigned { background: var(--f-unassigned-soft); color: var(--f-unassigned); }
  .chip--outline { background: transparent; border: 1px solid var(--border-card); color: var(--text-secondary); }
  .chip--role { background: var(--bg-soft); color: var(--text-secondary); font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .04em; font-size: 10px; }

  /* ---------------- Dashboard ---------------- */
  .dash-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .dash-card { padding: 18px; cursor: pointer; transition: transform .1s ease; }
  .dash-card:hover { transform: translateY(-2px); }
  .dash-card__top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 10px; }
  .dash-card__icon { font-size: 20px; }
  .dash-card__title { font-family: var(--font-display); font-size: 15px; font-weight: 600; margin: 0 0 4px; }
  .dash-card__value { font-family: var(--font-mono); font-size: 26px; font-weight: 500; margin-bottom: 4px; }
  .dash-card__note { font-size: 12px; color: var(--text-secondary); }

  /* ---------------- Structure module ---------------- */
  .structure { display: flex; flex-direction: column; height: 100%; }
  .structure-toolbar {
    display: flex; align-items: center; gap: 10px; padding: 14px 30px 0; flex-wrap: wrap; flex-shrink: 0;
  }
  .view-switch { display: flex; background: var(--bg-soft); border-radius: var(--radius-sm); padding: 3px; }
  .view-switch button { border: none; background: none; padding: 7px 14px; border-radius: 6px; font-weight: 600; font-size: 12.5px; color: var(--text-secondary); cursor: pointer; }
  .view-switch button.active { background: var(--bg-surface); color: var(--text-primary); box-shadow: var(--shadow-card); }
  .structure-search { flex: 1; max-width: 320px; position: relative; }
  .structure-search input { width: 100%; padding: 8px 12px 8px 30px; border: 1px solid var(--border-card); border-radius: var(--radius-sm); background: var(--bg-surface); }
  .structure-search::before { content: "⌕"; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
  .structure-body { flex: 1; display: flex; min-height: 0; position: relative; }

  /* tree/list mode */
  .tree-pane { width: 320px; flex-shrink: 0; border-right: 1px solid var(--border-soft); overflow-y: auto; padding: 14px 10px 30px; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; padding: 0 4px 10px; font-size: 11px; color: var(--text-secondary); }
  .legend__dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }

  .tree-row { display: flex; align-items: center; gap: 6px; padding: 7px 8px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
  .tree-row:hover { background: var(--bg-soft); }
  .tree-row.selected { background: var(--accent-sage); border-color: var(--accent-green-2); }
  .tree-row.match { box-shadow: inset 0 0 0 1px var(--f-warn); }
  .twisty { width: 16px; height: 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--text-muted); border-radius: 4px; font-size: 10px; }
  .twisty:hover { background: var(--border-card); }
  .twisty.empty { visibility: hidden; }
  .node-swatch { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
  .node-swatch.perm { background: var(--accent-green-2); }
  .node-swatch.temp { background: var(--accent-ochre); border-radius: 50%; }
  .node-swatch.archived { background: var(--text-muted); }
  .tree-row__label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .tree-row.is-archived .tree-row__label { text-decoration: line-through; color: var(--text-muted); font-weight: 400; }
  .tree-row__warn { color: var(--f-warn); font-size: 12px; flex-shrink: 0; }
  .tree-children { margin-left: 17px; border-left: 1px dashed var(--border-card); padding-left: 3px; }
  .tree-node.is-temp > .tree-row .tree-row__label { color: var(--accent-terra-strong); }
  .count-pill { background: var(--bg-surface); border-radius: 999px; padding: 1px 7px; font-family: var(--font-mono); font-size: 10.5px; color: var(--text-secondary); flex-shrink: 0; }
  .unassigned-pin { margin: 2px 0 10px; }
  .unassigned-pin .tree-row { background: var(--f-unassigned-soft); border: 1px dashed var(--f-unassigned); }
  .unassigned-pin .tree-row__label { color: var(--f-unassigned); font-weight: 600; }

  .tree-row[draggable="true"] { cursor: grab; }
  .tree-row.is-dragging { opacity: 0.4; }
  body.dnd-active .tree-row.drop-zone-invalid { opacity: 0.35; cursor: not-allowed; }
  body.dnd-active .tree-row.drop-zone-valid { box-shadow: inset 0 0 0 1px var(--f-good); background: var(--f-good-soft); }
  .map-block[draggable="true"] { cursor: grab; }
  .map-block.is-dragging { opacity: 0.35; }
  body.dnd-active .map-block.drop-zone-invalid { opacity: 0.3; cursor: not-allowed; }
  body.dnd-active .map-block.drop-zone-valid { box-shadow: 0 0 0 2px var(--f-good), var(--shadow-card); }
  .map-block.drop-target-active { box-shadow: 0 0 0 3px var(--f-good) inset, var(--shadow-card) !important; background: var(--f-good-soft) !important; }
  .tree-row.drop-target-active { box-shadow: 0 0 0 2px var(--f-good) inset !important; background: var(--f-good-soft) !important; }
  .person-row[draggable="true"] { cursor: grab; }
  .person-row.is-dragging { opacity: 0.4; }

  #dragIndicator {
    position: fixed; z-index: 500; pointer-events: none; transform: translate(14px, 18px);
    background: var(--accent-green-2); color: var(--white-soft); padding: 7px 12px; border-radius: 8px;
    font-size: 12.5px; font-weight: 500; box-shadow: var(--shadow-pop); max-width: 260px;
  }
  #dragIndicator.forbidden { background: var(--f-danger); }
  #dragIndicator.hidden { display: none; }

  /* center work area (tree/list mode) */
  .node-workspace { flex: 1; min-width: 0; overflow-y: auto; padding: 18px 26px 40px; }
  .node-workspace__head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 14px; }
  .node-workspace__title { font-family: var(--font-display); font-size: 24px; font-weight: 600; margin: 0 0 4px; }
  .node-workspace__sub { color: var(--text-secondary); font-size: 13px; }
  .warn-banner { display: flex; gap: 10px; padding: 11px 14px; border-radius: 10px; background: var(--f-warn-soft); color: #6b4a2e; margin-bottom: 12px; font-size: 13px; }
  .warn-banner.danger-tone { background: var(--f-danger-soft); color: #6b2a22; }
  .warn-banner strong { display: block; margin-bottom: 1px; }
  .info-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px 20px; margin-bottom: 18px; }
  .info-item__label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); margin-bottom: 3px; }
  .info-item__value { font-size: 14px; font-weight: 500; }
  .info-item__value.muted { color: var(--text-muted); font-weight: 400; font-style: italic; }
  .date-range { font-family: var(--font-mono); font-size: 12.5px; }

  .people-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px,1fr)); gap: 10px; }
  .person-row { display: flex; align-items: center; gap: 10px; padding: 10px; background: var(--bg-surface); border: 1px solid var(--border-card); border-radius: var(--radius-md); cursor: pointer; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-sage); color: var(--accent-green-2); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; flex-shrink: 0; }
  .person-row__name { font-weight: 600; font-size: 13px; }
  .person-row__title { color: var(--text-muted); font-size: 11.5px; }
  .person-row__tag { margin-left: auto; }
  .empty-note { color: var(--text-muted); font-size: 13px; padding: 10px 2px; font-style: italic; }

  /* map mode */
  .map-toolbar { display: flex; align-items: center; gap: 10px; padding: 10px 20px; border-bottom: 1px solid var(--border-soft); flex-shrink: 0; }
  .map-canvas-wrap { flex: 1; overflow: auto; background: var(--bg-page); background-image: radial-gradient(var(--border-card) 1px, transparent 1px); background-size: 22px 22px; position: relative; }
  .map-canvas { position: relative; transform-origin: top left; padding: 60px; }
  .map-block { position: absolute; width: 172px; padding: 10px 12px; border-radius: 10px; background: var(--bg-surface); border: 1.5px solid var(--accent-green-2); box-shadow: var(--shadow-card); cursor: pointer; transition: transform .1s ease; }
  .map-block:hover { transform: translateY(-2px); }
  .map-block.selected { box-shadow: 0 0 0 3px var(--accent-sage), var(--shadow-card); }
  .map-block.is-temp { border-style: dashed; border-color: var(--accent-terra-strong); }
  .map-block.is-archived { border-color: var(--text-muted); opacity: .55; }
  .map-block.focus-dim { opacity: .3; }
  .map-block__type { font-family: var(--font-mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); margin-bottom: 3px; }
  .map-block__name { font-weight: 700; font-size: 13px; line-height: 1.25; margin-bottom: 4px; }
  .map-block__meta { font-size: 11px; color: var(--text-secondary); }

  /* table mode */
  .table-wrap { flex: 1; overflow: auto; padding: 16px 26px 40px; }
  .data-table { width: 100%; border-collapse: collapse; background: var(--bg-surface); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-card); }
  .data-table th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); padding: 10px 14px; border-bottom: 1px solid var(--border-card); background: var(--bg-soft); position: sticky; top: 0; cursor: pointer; user-select: none; }
  .data-table th:hover { color: var(--text-primary); }
  .data-table td { padding: 10px 14px; border-bottom: 1px solid var(--border-soft); font-size: 13px; }
  .data-table tr:hover td { background: var(--bg-soft); cursor: pointer; }
  .table-toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .table-toolbar input, .table-toolbar select { padding: 7px 10px; border: 1px solid var(--border-card); border-radius: var(--radius-sm); background: var(--bg-surface); }

  /* ---------------- Context panel ---------------- */
  .context-panel {
    position: absolute; top: 0; right: 0; bottom: 0; width: 360px; background: var(--white-soft);
    border-left: 1px solid var(--border-card); box-shadow: -8px 0 24px rgba(34,54,51,0.08); z-index: 30;
    overflow-y: auto; transform: translateX(0); transition: transform .16s ease;
  }
  .context-panel.hidden-panel { transform: translateX(100%); pointer-events: none; }
  .context-panel__head { display: flex; align-items: flex-start; justify-content: space-between; padding: 18px 18px 0; }
  .context-panel__close { border: none; background: none; font-size: 18px; color: var(--text-muted); cursor: pointer; padding: 4px 6px; border-radius: 6px; }
  .context-panel__close:hover { background: var(--bg-soft); }
  .context-panel__body { padding: 4px 18px 30px; }
  .context-panel__title { font-family: var(--font-display); font-size: 21px; font-weight: 600; margin: 4px 0 4px; }
  .context-panel__actions { display: flex; flex-direction: column; gap: 6px; margin: 16px 0; }
  .context-panel__actions .btn { justify-content: flex-start; text-align: left; }
  .more-actions { position: relative; }

  /* ---------------- Assistant ---------------- */
  .assistant-fab {
    position: fixed; right: 22px; bottom: 22px; z-index: 90; width: 52px; height: 52px; border-radius: 50%;
    background: var(--accent-green-2); color: var(--white-soft); border: none; font-size: 22px; cursor: pointer;
    box-shadow: var(--shadow-pop); display: flex; align-items: center; justify-content: center;
  }
  .assistant-fab:hover { filter: brightness(1.15); }
  .assistant-panel {
    position: fixed; right: 22px; bottom: 86px; width: 340px; max-height: 70vh; background: var(--white-soft);
    border: 1px solid var(--border-card); border-radius: var(--radius-lg); box-shadow: var(--shadow-pop); z-index: 91;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .assistant-panel__head { padding: 14px 16px; background: var(--accent-green-2); color: var(--white-soft); display: flex; align-items: center; justify-content: space-between; }
  .assistant-panel__head h3 { margin: 0; font-family: var(--font-display); font-size: 15px; font-weight: 600; }
  .assistant-context { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); padding: 8px 16px; border-bottom: 1px solid var(--border-soft); line-height: 1.5; }
  .assistant-body { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
  .assistant-msg { background: var(--bg-soft); border-radius: 10px; padding: 9px 11px; font-size: 12.5px; line-height: 1.5; }
  .assistant-msg.from-user { background: var(--accent-sage); align-self: flex-end; }
  .assistant-quick { display: flex; flex-direction: column; gap: 6px; padding: 10px 16px 16px; border-top: 1px solid var(--border-soft); }
  .assistant-quick button { text-align: left; }

  /* ---------------- Modal (reused pattern) ---------------- */
  .modal-overlay { position: fixed; inset: 0; background: rgba(34,54,51,0.4); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .modal-overlay.hidden { display: none; }
  .modal { background: var(--white-soft); border-radius: var(--radius-lg); box-shadow: var(--shadow-pop); width: 100%; max-width: 460px; max-height: calc(100vh - 60px); overflow-y: auto; padding: 22px 24px 24px; }
  .modal.modal--wide { max-width: 620px; }
  .modal__head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .modal__title { font-family: var(--font-display); font-size: 19px; font-weight: 600; margin: 0; }
  .modal__close { border: none; background: none; font-size: 20px; color: var(--text-muted); cursor: pointer; padding: 2px 4px; border-radius: 6px; }
  .modal__close:hover { background: var(--bg-soft); }
  .modal__body { margin-top: 14px; }
  .modal__body p { margin: 0 0 12px; color: var(--text-secondary); font-size: 13.5px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 5px; color: var(--text-secondary); }
  .field input[type="text"], .field input[type="date"], .field input[type="file"], .field select, .field textarea {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border-card); border-radius: var(--radius-sm); background: var(--bg-surface); color: var(--text-primary);
  }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .checkbox-field { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .checkbox-field input { width: 16px; height: 16px; }
  .field-hint { font-size: 11.5px; color: var(--text-muted); margin-top: 4px; }
  .impact-box { background: var(--bg-soft); border: 1px solid var(--border-soft); border-radius: 9px; padding: 12px 14px; margin-bottom: 12px; }
  .impact-box h4 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-secondary); }
  .impact-box ul { margin: 0; padding-left: 18px; font-size: 13.5px; }
  .impact-choice { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; border: 1px solid var(--border-card); border-radius: 10px; margin-bottom: 10px; cursor: pointer; background: var(--bg-surface); }
  .impact-choice:hover { border-color: var(--accent-green-2); background: var(--accent-sage); }
  .impact-choice--danger:hover { border-color: var(--f-danger); background: var(--f-danger-soft); }
  .impact-choice__title { font-weight: 700; margin-bottom: 2px; }
  .impact-choice__desc { font-size: 12.5px; color: var(--text-secondary); }

  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--accent-green-2); color: var(--white-soft); padding: 10px 18px; border-radius: 999px; font-size: 13px; font-weight: 600; box-shadow: var(--shadow-pop); z-index: 200; transition: opacity .2s ease; }
  .toast.hidden { opacity: 0; pointer-events: none; }

  /* ---------------- Stub / settings pages ---------------- */
  .stub-card { padding: 40px 30px; text-align: center; }
  .stub-card__icon { font-size: 34px; margin-bottom: 10px; }
  .stub-card h2 { font-family: var(--font-display); font-size: 19px; margin: 0 0 6px; }
  .stub-card p { color: var(--text-secondary); font-size: 13.5px; max-width: 420px; margin: 0 auto; }

  .settings-tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 1px solid var(--border-soft); }
  .settings-tabs button { border: none; background: none; padding: 10px 16px; font-weight: 600; font-size: 13px; color: var(--text-secondary); cursor: pointer; border-bottom: 2px solid transparent; }
  .settings-tabs button.active { color: var(--accent-green-2); border-bottom-color: var(--accent-terra-strong); }
  .settings-section { padding: 20px; margin-bottom: 16px; }
  .settings-section h3 { font-family: var(--font-display); font-size: 16px; margin: 0 0 14px; }
  .import-drop { border: 2px dashed var(--border-card); border-radius: var(--radius-md); padding: 26px; text-align: center; margin-bottom: 14px; }
  .log-table { width: 100%; font-size: 12.5px; border-collapse: collapse; }
  .log-table th, .log-table td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border-soft); }

  @media (max-width: 900px) {
    .tree-pane { width: 240px; }
    .context-panel { width: 100%; }
    .info-grid { grid-template-columns: 1fr 1fr; }
  }
</style>

<script>
(function () {
  "use strict";

  /* =========================================================
     1. ДАННЫЕ — узлы структуры + сотрудники.
     Тот же движок, что в предыдущей версии прототипа (Block 1),
     перенесённый без изменений в новую оболочку Foundation.
     ========================================================= */
  let seq = 1;
  function uid(prefix) { return prefix + "_" + (seq++); }

  const nodes = {};
  const employees = {};

  function addNode(n) {
    nodes[n.id] = Object.assign({
      status: "active", managerId: null, actingManager: null,
      startDate: null, endDate: null, isTemporary: false, order: Object.keys(nodes).length,
    }, n);
    return nodes[n.id];
  }
  function addEmployee(e) {
    employees[e.id] = Object.assign({
      primaryNodeId: null, secondaryNodeIds: [], override: null, unassignedReason: null,
    }, e);
    return employees[e.id];
  }

  const N = {
    company: "n_company", admin: "n_admin", sales: "n_sales", production: "n_production",
    brigade1: "n_brigade1", brigade2: "n_brigade2", hr: "n_hr", project: "n_project",
  };

  function seed() {
    addNode({ id: N.company, name: "Стройсервис", type: "company", parentId: null });
    addNode({ id: N.admin, name: "Администрация", type: "department", parentId: N.company });
    addNode({ id: N.sales, name: "Отдел продаж", type: "department", parentId: N.company });
    addNode({ id: N.production, name: "Производство", type: "department", parentId: N.company });
    addNode({ id: N.brigade1, name: "Бригада 1", type: "team", parentId: N.production });
    addNode({ id: N.brigade2, name: "Бригада 2", type: "team", parentId: N.production });
    addNode({ id: N.hr, name: "Персонал", type: "department", parentId: N.company });
    addNode({
      id: N.project, name: "Проект «Объект Ганновер»", type: "project", parentId: N.company,
      isTemporary: true, startDate: "2026-09-01", endDate: "2027-03-31",
    });

    const firstNames = ["Алексей","Мария","Николай","Екатерина","Владимир","Ольга","Сергей","Наталья","Андрей","Ирина","Дмитрий","Татьяна","Игорь","Светлана","Роман","Юлия","Максим","Елена","Виктор","Анна","Павел","Кристина","Артём","Валентина","Денис","Марина","Кирилл","Людмила","Егор","Полина"];
    const lastNames = ["Смирнов","Иванов","Кузнецов","Соколов","Попов","Лебедев","Козлов","Новиков","Морозов","Волков","Соловьёв","Васильев","Зайцев","Павлов","Семёнов","Голубев","Виноградов","Богданов","Воробьёв","Фёдоров","Михайлов","Беляев","Тарасов","Белов","Комаров","Орлов","Киселёв","Макаров","Андреев","Ковалёв"];
    let nameCursor = 0;
    function nextName() {
      const f = firstNames[nameCursor % firstNames.length];
      const l = lastNames[Math.floor(nameCursor / firstNames.length) % lastNames.length];
      nameCursor++;
      return f + " " + l;
    }
    function genEmployees(nodeId, count, titles) {
      for (let i = 0; i < count; i++) addEmployee({ id: uid("e"), name: nextName(), title: titles[i % titles.length], primaryNodeId: nodeId });
    }

    const viktor = addEmployee({ id: uid("e"), name: "Виктор Соколов", title: "Генеральный директор", primaryNodeId: N.company });
    nodes[N.company].managerId = viktor.id;

    const nadezhda = addEmployee({ id: uid("e"), name: "Надежда Кузнецова", title: "Руководитель администрации", primaryNodeId: N.admin });
    nodes[N.admin].managerId = nadezhda.id;

    addEmployee({
      id: uid("e"), name: "Ольга Петрова", title: "Специалист по кадрам", primaryNodeId: N.admin,
      override: { originalNodeId: N.admin, tempNodeId: N.project, startDate: "2026-09-01", endDate: "2027-03-31", active: true },
    });

    addEmployee({ id: uid("e"), name: "Дмитрий Волков", title: "Менеджер по продажам", primaryNodeId: N.sales });
    addEmployee({ id: uid("e"), name: "Анна Кузнецова", title: "Менеджер по продажам", primaryNodeId: N.sales });

    const sergey = addEmployee({ id: uid("e"), name: "Сергей Иванов", title: "Начальник производства", primaryNodeId: N.production });
    nodes[N.production].managerId = sergey.id;

    const pavel = addEmployee({ id: uid("e"), name: "Павел Смирнов", title: "Бригадир", primaryNodeId: N.brigade1 });
    nodes[N.brigade1].managerId = pavel.id;
    addEmployee({ id: uid("e"), name: "Иван Новиков", title: "Монтажник", primaryNodeId: N.brigade1, secondaryNodeIds: [N.project] });

    const roman = addEmployee({ id: uid("e"), name: "Роман Соловьёв", title: "Бригадир", primaryNodeId: N.brigade2 });
    nodes[N.brigade2].managerId = roman.id;

    const tatyana = addEmployee({ id: uid("e"), name: "Татьяна Орлова", title: "Руководитель отдела персонала", primaryNodeId: N.hr });
    nodes[N.hr].managerId = tatyana.id;

    const elena = addEmployee({ id: uid("e"), name: "Елена Морозова", title: "Руководитель проекта", primaryNodeId: N.project });
    nodes[N.project].managerId = elena.id;

    addEmployee({ id: uid("e"), name: "Мария Волкова", title: "Новый сотрудник", primaryNodeId: null, unassignedReason: "Только что принята — ещё не назначена" });

    // Заполняем компанию до ~50 человек (§23 — руками поправлено владельцем на 50).
    genEmployees(N.admin, 3, ["Секретарь", "Офис-менеджер", "Юрист"]);
    genEmployees(N.sales, 7, ["Менеджер по продажам", "Менеджер по работе с клиентами"]);
    genEmployees(N.production, 2, ["Инженер производства", "Технолог"]);
    genEmployees(N.brigade1, 9, ["Монтажник", "Сварщик", "Разнорабочий"]);
    genEmployees(N.brigade2, 10, ["Монтажник", "Сварщик", "Разнорабочий"]);
    genEmployees(N.hr, 6, ["HR-специалист", "Рекрутёр"]);
    genEmployees(N.project, 1, ["Координатор проекта"]);
  }
  seed();

  /* =========================================================
     2. СОСТОЯНИЕ
     ========================================================= */
  const ROUTES = ["dashboard", "structure", "people", "roles", "org", "projects", "settings", "support"];
  const ROLE_LABELS = { owner: "Владелец", structure_admin: "Администратор структуры", hr: "HR", department_manager: "Руководитель подразделения", employee: "Сотрудник", viewer: "Наблюдатель" };
  const ROLE_CAPS = {
    owner:              { editStructure: true,  manageEmployees: true,  archive: true,  orgSettings: true,  programStatus: true },
    structure_admin:    { editStructure: true,  manageEmployees: true,  archive: true,  orgSettings: false, programStatus: false },
    hr:                 { editStructure: false, manageEmployees: true,  archive: false, orgSettings: false, programStatus: false },
    department_manager: { editStructure: false, manageEmployees: true,  archive: false, orgSettings: false, programStatus: false },
    employee:           { editStructure: false, manageEmployees: false, archive: false, orgSettings: false, programStatus: false },
    viewer:             { editStructure: false, manageEmployees: false, archive: false, orgSettings: false, programStatus: false },
  };

  const UNASSIGNED = "__UNASSIGNED__";
  const DEEP_WARN_DEPTH = 3;
  const TYPE_LABEL = { company: "Компания", department: "Отдел", branch: "Филиал", team: "Бригада/команда", project: "Проект" };

  const state = {
    route: "dashboard",
    currentUserId: null, // проставляется в init() на Виктора
    currentRole: "owner",
    language: "ru",
    sidebarCollapsed: false,
    sidebarUserCollapsed: false,

    structureView: "tree",
    lastWorkingView: "tree", // куда возвращаться из Карты структуры (§ правки: сохранять контекст)
    selectedId: N.company,
    contextPanelOpen: false,
    expanded: new Set([N.company, N.production]),
    query: "",
    mapZoom: 1,
    mapFocusId: null,
    tableSort: { col: "name", dir: 1 },
    tableFilter: "",

    assistantOpen: false,
    assistantThread: [],

    orgSettings: { name: "Стройсервис", country: "Россия", timezone: "Europe/Moscow", locale: "ru-RU" },
    programStatus: "active",

    notifications: [
      { id: "n1", kind: "system", text: "Добро пожаловать в Foundation — новая версия модуля «Структура».", read: false },
      { id: "n2", kind: "system", text: "Доступно обновление модуля «Структура».", read: false },
    ],
    supportCases: [],
    importLog: [],
    settingsTab: "personal",
  };

  let autosaveTimer = null;

  /* =========================================================
     3. ХЕЛПЕРЫ ДАННЫХ (без изменений от предыдущей версии)
     ========================================================= */
  function allNodes() { return Object.values(nodes); }
  function allEmployees() { return Object.values(employees); }
  function childrenOf(parentId) { return allNodes().filter((n) => n.parentId === parentId).sort((a, b) => a.order - b.order); }
  function depthOf(id) { let d = 0, cur = nodes[id]; while (cur && cur.parentId) { d++; cur = nodes[cur.parentId]; } return d; }
  function subtreeIds(rootId) { const out = [rootId]; childrenOf(rootId).forEach((c) => out.push(...subtreeIds(c.id))); return out; }
  function ancestorsOf(id) { const out = []; let cur = nodes[id] && nodes[id].parentId ? nodes[nodes[id].parentId] : null; while (cur) { out.push(cur.id); cur = cur.parentId ? nodes[cur.parentId] : null; } return out; }
  function effectivePrimary(empId) { const e = employees[empId]; if (!e) return null; if (e.override && e.override.active) return e.override.tempNodeId; return e.primaryNodeId; }
  function employeesPrimaryAt(nodeId) { return allEmployees().filter((e) => effectivePrimary(e.id) === nodeId); }
  function employeesSecondaryAt(nodeId) { return allEmployees().filter((e) => e.secondaryNodeIds.includes(nodeId)); }
  function unassignedEmployees() { return allEmployees().filter((e) => effectivePrimary(e.id) === null); }
  function hasManager(n) { return !!(n.managerId || (n.actingManager && n.actingManager.employeeId)); }
  function nodeHeadcount(nodeId) { return employeesPrimaryAt(nodeId).length + employeesSecondaryAt(nodeId).length; }
  function fmtDate(iso) { if (!iso) return "—"; const d = new Date(iso + "T00:00:00"); return d.toLocaleDateString("ru-RU", { day: "2-digit", month: "short", year: "numeric" }); }
  function fmtDateTime(iso) { const d = new Date(iso); return d.toLocaleDateString("ru-RU") + " " + d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" }); }
  function initials(name) { return name.split(" ").map((p) => p[0]).slice(0, 2).join("").toUpperCase(); }
  function activeNodesFlat() { const out = []; (function walk(id, depth) { out.push({ id, depth }); childrenOf(id).forEach((c) => walk(c.id, depth + 1)); })(N.company, 0); return out; }
  function vacantLeadNodes() { return allNodes().filter((n) => n.status !== "archived" && n.type !== "company" && !hasManager(n)); }
  function deepNodes() { return allNodes().filter((n) => n.status !== "archived" && depthOf(n.id) >= DEEP_WARN_DEPTH); }
  function currentCaps() { return ROLE_CAPS[state.currentRole]; }
  function escapeHtml(v) { return String(v == null ? "" : v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function escapeAttr(v) { return escapeHtml(v).replace(/"/g, "&quot;"); }

  /* =========================================================
     4. МУТАЦИИ
     ========================================================= */
  function addChildNode({ parentId, name, type, isTemporary, startDate, endDate }) {
    const id = uid("n");
    addNode({ id, name, type, parentId, isTemporary: !!isTemporary, startDate: startDate || null, endDate: endDate || null, order: Date.now() });
    return id;
  }
  function renameNode(id, name) { nodes[id].name = name; }
  function changeType(id, type) { nodes[id].type = type; }
  function setManager(id, employeeId) { nodes[id].managerId = employeeId || null; }
  function setActingManager(id, employeeId, startDate, endDate) { nodes[id].actingManager = employeeId ? { employeeId, startDate: startDate || null, endDate: endDate || null } : null; }
  function moveEmployeePrimary(empId, nodeId) { const e = employees[empId]; e.primaryNodeId = nodeId; e.unassignedReason = null; }
  function addSecondaryLink(empId, nodeId) { const e = employees[empId]; if (!e.secondaryNodeIds.includes(nodeId)) e.secondaryNodeIds.push(nodeId); }
  function removeSecondaryLink(empId, nodeId) { const e = employees[empId]; e.secondaryNodeIds = e.secondaryNodeIds.filter((id) => id !== nodeId); }
  function startOverride(empId, tempNodeId, startDate, endDate) { const e = employees[empId]; e.override = { originalNodeId: e.primaryNodeId, tempNodeId, startDate: startDate || null, endDate: endDate || null, active: true }; }
  function endOverride(empId) { employees[empId].override = null; }
  function reparent(nodeId, newParentId) { nodes[nodeId].parentId = newParentId; }
  function createEmployee({ name, title, primaryNodeId, reason }) {
    const id = uid("e");
    addEmployee({ id, name, title, primaryNodeId: primaryNodeId || null, unassignedReason: primaryNodeId ? null : (reason || "Ещё не назначен") });
    return id;
  }
  function assignFromUnassigned(empId, nodeId) { const e = employees[empId]; e.primaryNodeId = nodeId; e.unassignedReason = null; }
  function archiveSubtree(rootId) {
    const ids = subtreeIds(rootId);
    ids.forEach((id) => { nodes[id].status = "archived"; });
    allEmployees().forEach((e) => {
      if (e.override && e.override.active && ids.includes(e.override.tempNodeId)) e.override = null;
      if (e.primaryNodeId && ids.includes(e.primaryNodeId)) { e.unassignedReason = "Структура «" + nodes[rootId].name + "» была закрыта"; e.primaryNodeId = null; }
      e.secondaryNodeIds = e.secondaryNodeIds.filter((sid) => !ids.includes(sid));
    });
  }
  function reparentChildrenThenArchive(nodeId) {
    const parentId = nodes[nodeId].parentId;
    childrenOf(nodeId).forEach((c) => { c.parentId = parentId; });
    nodes[nodeId].status = "archived";
    allEmployees().forEach((e) => {
      if (e.override && e.override.active && e.override.tempNodeId === nodeId) e.override = null;
      if (e.primaryNodeId === nodeId) { e.unassignedReason = "Узел «" + nodes[nodeId].name + "» был закрыт (дочерние подразделения сохранены)"; e.primaryNodeId = null; }
      e.secondaryNodeIds = e.secondaryNodeIds.filter((sid) => sid !== nodeId);
    });
  }

  /* =========================================================
     5. МОДАЛЬНОЕ ОКНО / TOAST — общие примитивы
     ========================================================= */
  function openModal(title, bodyHtml, wide) {
    document.getElementById("modalTitle").textContent = title;
    document.getElementById("modalBody").innerHTML = bodyHtml;
    document.getElementById("modalBox").classList.toggle("modal--wide", !!wide);
    document.getElementById("modalOverlay").classList.remove("hidden");
  }
  function closeModal() {
    document.getElementById("modalOverlay").classList.add("hidden");
    document.getElementById("modalBody").innerHTML = "";
  }
  document.getElementById("modalCloseBtn").addEventListener("click", closeModal);
  document.getElementById("modalOverlay").addEventListener("click", (e) => { if (e.target.id === "modalOverlay") closeModal(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeModal(); closeAllDropdowns(); } });

  let toastTimer = null;
  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.remove("hidden");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.add("hidden"), 2800);
  }

  /* =========================================================
     6. ДИАГНОСТИЧЕСКИЙ КОНТЕКСТ (§17) — единый стандарт,
     который используют и Помощник, и Техподдержка.
     ========================================================= */
  function buildDiagnosticContext(extra) {
    return Object.assign({
      errorRefId: "ERR-" + Math.random().toString(36).slice(2, 8).toUpperCase(),
      userId: state.currentUserId,
      userName: employees[state.currentUserId] ? employees[state.currentUserId].name : "—",
      organizationId: "org_stroyservice",
      role: state.currentRole,
      screenId: state.route,
      objectId: state.route === "structure" ? state.selectedId : null,
      actionId: null,
      timestamp: new Date().toISOString(),
    }, extra || {});
  }

  /* =========================================================
     7. SHELL: routing, топбар, sidebar
     ========================================================= */
  const NAV_ITEMS = [
    { id: "dashboard", icon: "🏠", label: "Dashboard" },
    { id: "people", icon: "🧑‍🤝‍🧑", label: "Люди" },
    { id: "roles", icon: "🔐", label: "Роли и права" },
    { id: "org", icon: "🏢", label: "Организация" },
    { id: "structure", icon: "🗂️", label: "Структура" },
    { id: "projects", icon: "📁", label: "Проекты" },
    { id: "settings", icon: "⚙️", label: "Настройки" },
    { id: "support", icon: "🛟", label: "Техподдержка" },
  ];
  const SECTION_TITLES = { dashboard: "Dashboard", people: "Люди", roles: "Роли и права", org: "Организация", structure: "Структура", projects: "Проекты", settings: "Настройки", support: "Техподдержка" };

  function navigate(route, opts) {
    opts = opts || {};
    state.route = route;
    if (route !== "structure") state.contextPanelOpen = false;
    if (!opts.keepSidebar) state.sidebarCollapsed = state.sidebarUserCollapsed;
    closeAllDropdowns();
    renderShell();
  }

  function closeAllDropdowns() {
    ["langDropdown", "notifDropdown", "profileDropdown"].forEach((id) => document.getElementById(id).classList.add("hidden"));
  }

  function renderShell() {
    document.getElementById("sectionTitle").textContent = SECTION_TITLES[state.route];
    document.getElementById("sidebar").classList.toggle("collapsed", state.sidebarCollapsed);
    renderNav();
    renderProgramStatusChip();
    renderNotifBadge();
    renderMainContent();
  }

  function renderNav() {
    const ul = document.getElementById("navList");
    ul.innerHTML = "";
    NAV_ITEMS.forEach((item) => {
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.className = "nav-item" + (state.route === item.id ? " active" : "");
      btn.innerHTML = '<span class="nav-item__icon">' + item.icon + "</span><span>" + item.label + "</span>";
      btn.addEventListener("click", () => navigate(item.id));
      li.appendChild(btn);
      ul.appendChild(li);
    });
  }

  function renderProgramStatusChip() {
    const el = document.getElementById("programStatusChip");
    const map = { active: ["active", "Активна"], paused: ["paused", "Приостановлена"], maintenance: ["maintenance", "Режим обслуживания"] };
    const [cls, label] = map[state.programStatus];
    el.className = "status-chip " + cls;
    el.innerHTML = '<span class="status-chip__dot"></span>' + label;
  }

  function renderMainContent() {
    // Бейдж уведомлений и статус-чип зависят от тех же данных, что и
    // содержимое страницы (например, Vacant Lead) — обновляем их при
    // каждом изменении, а не только при полной навигации, иначе
    // "любое изменение сразу отражается" не выполнялось бы для шапки.
    renderNotifBadge();
    renderProgramStatusChip();
    const inner = document.getElementById("mainInner");
    inner.className = "main-inner" + (state.route === "structure" ? " wide" : "");
    if (state.route === "dashboard") inner.innerHTML = renderDashboard();
    else if (state.route === "structure") { inner.innerHTML = renderStructureModule(); bindStructureHandlers(); return; }
    else if (state.route === "people") inner.innerHTML = renderPeoplePage();
    else if (state.route === "roles") inner.innerHTML = renderRolesPage();
    else if (state.route === "org") inner.innerHTML = renderOrgPage();
    else if (state.route === "projects") inner.innerHTML = renderProjectsPage();
    else if (state.route === "settings") { inner.innerHTML = renderSettingsPage(); bindSettingsHandlers(); return; }
    else if (state.route === "support") { inner.innerHTML = renderSupportPage(); bindSupportHandlers(); return; }
    bindGenericPageHandlers();
  }

  function bindGenericPageHandlers() {
    document.querySelectorAll("[data-nav]").forEach((el) => el.addEventListener("click", () => navigate(el.dataset.nav)));
  }

  document.getElementById("burgerBtn").addEventListener("click", () => {
    state.sidebarCollapsed = !state.sidebarCollapsed;
    state.sidebarUserCollapsed = state.sidebarCollapsed;
    renderShell();
  });

  /* =========================================================
     8. DASHBOARD
     ========================================================= */
  function dashCard(id, icon, title, value, note, tone) {
    return '<div class="card dash-card" data-nav="' + id + '">' +
      '<div class="dash-card__top"><span class="dash-card__icon">' + icon + '</span>' + (tone ? '<span class="chip chip--' + tone.cls + '">' + tone.label + "</span>" : "") + "</div>" +
      '<h3 class="dash-card__title">' + title + '</h3><div class="dash-card__value">' + value + '</div><div class="dash-card__note">' + note + "</div></div>";
  }

  function renderDashboard() {
    const vacant = vacantLeadNodes().length;
    const unassigned = unassignedEmployees().length;
    const tempProjects = allNodes().filter((n) => n.isTemporary && n.status !== "archived").length;
    const problems = vacant + deepNodes().length;
    const unreadNotif = state.notifications.filter((n) => !n.read).length;
    const settingsIncomplete = !state.orgSettings.country || state.importLog.length === 0;

    let html = '<div class="page-head"><h1>Foundation — обзор</h1><p>Первый экран приложения: статус всех модулей в одном месте.</p></div>';
    html += '<div class="dash-grid">';
    html += dashCard("people", "🧑‍🤝‍🧑", "Люди", String(allEmployees().length), "сотрудников в системе", null);
    html += dashCard("roles", "🔐", "Роли и права", ROLE_LABELS[state.currentRole], "ваша текущая демо-роль", { cls: "outline", label: "Базово" });
    html += dashCard("org", "🏢", "Организация", escapeHtml(state.orgSettings.name), state.orgSettings.country + " · " + state.orgSettings.timezone, { cls: "good", label: "Настроено" });
    html += dashCard("structure", "🗂️", "Структура", String(allNodes().filter((n) => n.status !== "archived").length) + " узлов", problems ? problems + " требуют внимания" : "предупреждений нет", problems ? { cls: "warn", label: "Требует внимания" } : { cls: "good", label: "В порядке" });
    html += dashCard("projects", "📁", "Проекты", String(tempProjects), "временных объектов активно", null);
    html += dashCard("dashboard", "🔔", "Уведомления", String(unreadNotif), "непрочитанных", unreadNotif ? { cls: "warn", label: "Есть новые" } : null);
    html += dashCard("structure", "⚠️", "Ошибки / проблемы", String(vacant), "подразделений без руководителя", vacant ? { cls: "danger", label: "Требует внимания" } : { cls: "good", label: "Нет" });
    html += dashCard("settings", "🧩", "Незавершённые настройки", settingsIncomplete ? "Есть" : "Нет", "импорт данных, региональные параметры", settingsIncomplete ? { cls: "warn", label: "Требует внимания" } : { cls: "good", label: "Готово" });
    html += "</div>";
    return html;
  }

  /* =========================================================
     9. МОДУЛЬ «СТРУКТУРА» — одна общая модель данных (nodes/employees/
     state), но два САМОСТОЯТЕЛЬНЫХ экрана поверх неё: «Рабочий вид»
     (список/дерево + таблица — точная работа) и «Карта структуры»
     (пространственное редактирование). Это НЕ сегменты одного
     переключателя — переход между ними идёт через явные кнопки
     («Карта структуры» / «Вернуться в рабочий вид»), как два разных
     способа работать с одной и той же структурой. Ни один из экранов
     не хранит собственную копию данных — оба читают и пишут в один и
     тот же nodes/employees/state, поэтому изменение в любом из них
     мгновенно видно в другом при переходе (без ручной синхронизации).
     Внутри «Рабочего вида» есть свой лёгкий переключатель Список/Таблица
     — это два инструмента одного и того же режима, не отдельные экраны.
     ========================================================= */
  function goToMapScreen() {
    state.lastWorkingView = state.structureView === "map" ? (state.lastWorkingView || "tree") : state.structureView;
    state.structureView = "map";
    state.sidebarCollapsed = true;
    renderShell();
  }
  function returnToWorkingView() {
    state.structureView = state.lastWorkingView || "tree";
    state.sidebarCollapsed = state.sidebarUserCollapsed;
    renderShell();
  }
  function switchWorkingSubView(view) {
    state.structureView = view;
    renderShell();
  }

  function renderStructureModule() {
    if (state.structureView === "map") return renderMapScreen();
    return renderWorkingScreen();
  }

  function renderWorkingScreen() {
    let html = '<div class="structure">';
    html += '<div class="structure-toolbar">';
    html += '<div class="view-switch">' +
      '<button data-subview="tree" class="' + (state.structureView === "tree" ? "active" : "") + '">Список</button>' +
      '<button data-subview="table" class="' + (state.structureView === "table" ? "active" : "") + '">Таблица</button>' +
      "</div>";
    if (state.structureView === "tree") html += '<div class="structure-search"><input type="text" id="structureSearch" placeholder="Отдел, проект или сотрудник…" value="' + escapeAttr(state.query) + '" autocomplete="off"></div>';
    const vacant = vacantLeadNodes().length;
    if (vacant) html += '<span class="chip chip--danger">⚠ Vacant Lead: ' + vacant + "</span>";
    html += '<button class="btn btn--dark" id="goMapBtn" style="margin-left:auto;">🗺️ Карта структуры →</button>';
    html += "</div>";
    html += '<div class="structure-body">';
    html += state.structureView === "table" ? renderTableMode() : renderTreeAndWorkspace();
    html += renderContextPanel();
    html += "</div></div>";
    return html;
  }

  function renderMapScreen() {
    let html = '<div class="structure">' + renderMapMode() + renderContextPanel() + "</div>";
    return html;
  }

  function bindStructureHandlers() {
    if (state.structureView === "map") { bindMapHandlers(); bindContextPanelHandlers(); return; }
    document.getElementById("goMapBtn").addEventListener("click", goToMapScreen);
    document.querySelectorAll("[data-subview]").forEach((btn) => btn.addEventListener("click", () => switchWorkingSubView(btn.dataset.subview)));
    const search = document.getElementById("structureSearch");
    if (search) search.addEventListener("input", () => { state.query = search.value; renderMainContent(); const s = document.getElementById("structureSearch"); if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); } });
    if (state.structureView === "tree") bindTreeHandlers();
    else bindTableHandlers();
    bindContextPanelHandlers();
  }

  /* ---------------- Дерево / Список ---------------- */
  function searchMatches() {
    const q = state.query.trim().toLowerCase();
    if (!q) return null;
    const nodeIds = new Set();
    allNodes().forEach((n) => { if (n.name.toLowerCase().includes(q)) nodeIds.add(n.id); });
    allEmployees().forEach((e) => { if (e.name.toLowerCase().includes(q)) { const p = effectivePrimary(e.id); if (p) nodeIds.add(p); } });
    return nodeIds;
  }

  function renderTreeAndWorkspace() {
    return '<div class="tree-pane" id="treePane"></div><div class="node-workspace" id="nodeWorkspace"></div>';
  }

  function bindTreeHandlers() {
    renderTree();
    renderNodeWorkspace();
  }

  function renderTree() {
    const matches = searchMatches();
    if (matches) matches.forEach((id) => ancestorsOf(id).forEach((a) => state.expanded.add(a)));
    const root = document.getElementById("treePane");
    if (!root) return;
    root.innerHTML = '<div class="legend"><span><span class="legend__dot" style="background:var(--accent-green-2)"></span>Постоянная</span><span><span class="legend__dot" style="background:var(--accent-ochre)"></span>Временная</span><span><span class="legend__dot" style="background:var(--text-muted)"></span>Архив</span></div>';
    root.appendChild(buildUnassignedPin());
    root.appendChild(buildTreeNode(N.company, matches));
    if (matches && matches.size === 0) { const note = document.createElement("div"); note.className = "empty-note"; note.textContent = "Нет совпадений."; root.appendChild(note); }
  }

  function buildUnassignedPin() {
    const wrap = document.createElement("div");
    wrap.className = "unassigned-pin";
    const row = document.createElement("div");
    row.className = "tree-row" + (state.selectedId === UNASSIGNED ? " selected" : "");
    row.innerHTML = '<span class="twisty empty"></span><span class="node-swatch" style="background:var(--f-unassigned);border-radius:50%"></span><span class="tree-row__label">Требуют назначения</span><span class="count-pill">' + unassignedEmployees().length + "</span>";
    row.addEventListener("click", () => selectStructureObject(UNASSIGNED));
    wrap.appendChild(row);
    return wrap;
  }

  function buildTreeNode(id, matches) {
    const n = nodes[id];
    const kids = childrenOf(id);
    const wrap = document.createElement("div");
    wrap.className = "tree-node" + (n.isTemporary ? " is-temp" : "");
    const row = document.createElement("div");
    row.className = "tree-row" + (state.selectedId === id ? " selected" : "") + (n.status === "archived" ? " is-archived" : "") + (matches && matches.has(id) ? " match" : "");
    const twisty = document.createElement("span");
    twisty.className = "twisty" + (kids.length === 0 ? " empty" : "");
    twisty.textContent = kids.length ? (state.expanded.has(id) ? "▾" : "▸") : "";
    twisty.addEventListener("click", (ev) => { ev.stopPropagation(); if (state.expanded.has(id)) state.expanded.delete(id); else state.expanded.add(id); renderTree(); });
    row.appendChild(twisty);
    const swatch = document.createElement("span");
    swatch.className = "node-swatch " + (n.status === "archived" ? "archived" : n.isTemporary ? "temp" : "perm");
    row.appendChild(swatch);
    const label = document.createElement("span");
    label.className = "tree-row__label";
    label.textContent = n.name;
    row.appendChild(label);
    if (depthOf(id) >= DEEP_WARN_DEPTH && n.status !== "archived") { const w = document.createElement("span"); w.className = "tree-row__warn"; w.title = "Слишком глубокая структура"; w.textContent = "⚠"; row.appendChild(w); }
    if (n.status !== "archived" && n.type !== "company" && !hasManager(n)) { const w = document.createElement("span"); w.className = "tree-row__warn"; w.title = "Vacant Lead — нет руководителя"; w.textContent = "○"; row.appendChild(w); }
    const count = document.createElement("span");
    count.className = "count-pill";
    count.textContent = nodeHeadcount(id);
    row.appendChild(count);
    row.addEventListener("click", () => selectStructureObject(id));
    row.dataset.nodeId = id;
    if (n.status !== "archived" && n.type !== "company" && currentCaps().editStructure) {
      row.draggable = true;
      row.addEventListener("dragstart", (ev) => onNodeDragStart(ev, id));
      row.addEventListener("dragend", onDragEnd);
    }
    row.addEventListener("dragover", (ev) => onRowDragOver(ev, row, id));
    row.addEventListener("dragleave", () => row.classList.remove("drop-target-active"));
    row.addEventListener("drop", (ev) => onRowDrop(ev, row, id));
    wrap.appendChild(row);
    if (kids.length && state.expanded.has(id)) {
      const childWrap = document.createElement("div");
      childWrap.className = "tree-children";
      kids.forEach((c) => childWrap.appendChild(buildTreeNode(c.id, matches)));
      wrap.appendChild(childWrap);
    }
    return wrap;
  }

  function selectStructureObject(id) {
    state.selectedId = id;
    state.contextPanelOpen = true;
    renderMainContent();
  }

  function renderNodeWorkspace() {
    const el = document.getElementById("nodeWorkspace");
    if (!el) return;
    if (state.selectedId === UNASSIGNED) { el.innerHTML = renderUnassignedWorkspace(); return; }
    const n = nodes[state.selectedId];
    if (!n) { state.selectedId = N.company; return renderNodeWorkspace(); }
    const primaryPeople = employeesPrimaryAt(n.id);
    const secondaryPeople = employeesSecondaryAt(n.id);
    const isArchived = n.status === "archived";
    const deep = depthOf(n.id) >= DEEP_WARN_DEPTH;

    let html = '<div class="node-workspace__head"><div><div class="node-workspace__title">' + escapeHtml(n.name) + '</div><div class="node-workspace__sub">' + TYPE_LABEL[n.type] + (n.isTemporary ? " · временная" : "") + (isArchived ? " · архив" : "") + "</div></div>";
    html += '<button class="btn btn--sm" data-open-panel="1">Открыть карточку →</button></div>';

    if (!isArchived && n.type !== "company" && !hasManager(n)) html += '<div class="warn-banner danger-tone"><span>⚠</span><div><strong>Vacant Lead</strong>У этого узла нет руководителя.</div></div>';
    if (!isArchived && deep) html += '<div class="warn-banner"><span>⚠</span><div><strong>Слишком глубокая структура</strong>Уровень ' + (depthOf(n.id) + 1) + ' от компании.</div></div>';

    html += '<div class="info-grid">';
    html += infoItem("Руководитель", n.managerId ? escapeHtml(employees[n.managerId].name) : '<span class="muted">не назначен</span>');
    html += infoItem("И.О.", n.actingManager ? escapeHtml(employees[n.actingManager.employeeId].name) : '<span class="muted">нет</span>');
    html += infoItem("Сотрудников", String(primaryPeople.length + secondaryPeople.length));
    if (n.isTemporary) html += infoItem("Период", '<span class="date-range">' + fmtDate(n.startDate) + " – " + fmtDate(n.endDate) + "</span>");
    html += "</div>";

    html += '<div class="people-grid">';
    if (!primaryPeople.length && !secondaryPeople.length) html += '<div class="empty-note">Пока никто не назначен сюда.</div>';
    primaryPeople.forEach((e) => { html += workspacePersonCard(e, n.id, "primary"); });
    secondaryPeople.forEach((e) => { html += workspacePersonCard(e, n.id, "secondary"); });
    html += "</div>";
    el.innerHTML = html;

    const openBtn = el.querySelector("[data-open-panel]");
    if (openBtn) openBtn.addEventListener("click", () => { state.contextPanelOpen = true; renderMainContent(); });
    el.querySelectorAll("[data-emp-id]").forEach((row) => {
      row.addEventListener("click", () => selectStructureObject("emp:" + row.dataset.empId));
      if (row.getAttribute("draggable") === "true") { row.addEventListener("dragstart", (ev) => onEmployeeDragStart(ev, row.dataset.empId)); row.addEventListener("dragend", onDragEnd); }
    });
  }

  function infoItem(label, valueHtml) { return '<div class="info-item"><div class="info-item__label">' + label + '</div><div class="info-item__value">' + valueHtml + "</div></div>"; }

  function workspacePersonCard(e, nodeId, kind) {
    const isOverrideHere = e.override && e.override.active && e.override.tempNodeId === nodeId;
    const draggableAttr = kind === "primary" && !isOverrideHere && currentCaps().manageEmployees ? ' draggable="true"' : "";
    let html = '<div class="person-row" data-emp-id="' + e.id + '"' + draggableAttr + ">";
    html += '<div class="avatar">' + initials(e.name) + "</div><div><div class=\"person-row__name\">" + escapeHtml(e.name) + '</div><div class="person-row__title">' + escapeHtml(e.title || "") + "</div></div>";
    if (kind === "secondary") html += '<span class="chip chip--terra person-row__tag">доп. связь</span>';
    if (isOverrideHere) html += '<span class="chip chip--terra person-row__tag">времен. Primary</span>';
    html += "</div>";
    return html;
  }

  function renderUnassignedWorkspace() {
    const list = unassignedEmployees();
    let html = '<div class="node-workspace__head"><div><div class="node-workspace__title">Требуют назначения</div><div class="node-workspace__sub">Системная зона — не подразделение</div></div></div>';
    html += '<div class="warn-banner"><span>ℹ️</span><div><strong>Smart Unassigned</strong>Временный список сотрудников без основной принадлежности. Нет руководителя и обычной иерархии.</div></div>';
    html += '<div class="people-grid">';
    if (!list.length) html += '<div class="empty-note">Сейчас никто не требует назначения.</div>';
    list.forEach((e) => { html += workspacePersonCard(e, UNASSIGNED, "primary"); });
    html += "</div>";
    return html;
  }

  /* ---------------- Карта (§6.2 — по центру, максимум площади) ---------------- */
  function renderMapMode() {
    let html = '<div class="map-view-wrap" style="flex:1;display:flex;flex-direction:column;min-width:0;">';
    html += '<div class="map-toolbar">';
    html += '<button class="btn btn--dark" id="backToWorkingBtn">← Вернуться в рабочий вид</button>';
    html += '<button class="btn btn--sm" id="mapZoomOut">−</button><span class="chip chip--outline" id="mapZoomLabel">100%</span><button class="btn btn--sm" id="mapZoomIn">+</button>';
    html += '<button class="btn btn--sm" id="mapFit">Fit to screen</button><button class="btn btn--sm" id="mapReset">Сбросить вид</button>';
    if (state.mapFocusId) html += '<button class="btn btn--sm btn--dark" id="mapFocusExit">✕ Выйти из Focus mode: «' + escapeHtml(nodes[state.mapFocusId].name) + '»</button>';
    html += '<span style="margin-left:auto;font-size:11.5px;color:var(--text-secondary);">Клик по узлу — выбрать · двойной клик — Focus mode</span>';
    html += "</div>";
    html += '<div class="map-canvas-wrap" id="mapCanvasWrap"><div class="map-canvas" id="mapCanvas"></div></div></div>';
    return html;
  }

  function bindMapHandlers() {
    document.getElementById("backToWorkingBtn").addEventListener("click", returnToWorkingView);
    document.getElementById("mapZoomIn").addEventListener("click", () => { state.mapZoom = Math.min(1.8, state.mapZoom + 0.15); renderMap(); });
    document.getElementById("mapZoomOut").addEventListener("click", () => { state.mapZoom = Math.max(0.35, state.mapZoom - 0.15); renderMap(); });
    document.getElementById("mapFit").addEventListener("click", () => { state.mapZoom = 0.7; renderMap(); document.getElementById("mapCanvasWrap").scrollTo(0, 0); });
    document.getElementById("mapReset").addEventListener("click", () => { state.mapZoom = 1; state.mapFocusId = null; document.getElementById("mapCanvasWrap").scrollTo(0, 0); renderMap(); });
    const exitBtn = document.getElementById("mapFocusExit");
    if (exitBtn) exitBtn.addEventListener("click", () => { state.mapFocusId = null; renderMap(); });
    renderMap();
  }

  function renderMap() {
    const canvas = document.getElementById("mapCanvas");
    if (!canvas) return;
    const colW = 190, rowH = 128;
    let leafX = 0;
    const pos = {};
    const rootId = state.mapFocusId || N.company;
    function layout(id, depth) {
      const kids = childrenOf(id);
      if (!kids.length) { pos[id] = { x: leafX * colW, y: depth * rowH }; leafX++; return pos[id].x; }
      const xs = kids.map((c) => layout(c.id, depth + 1));
      const myX = (Math.min(...xs) + Math.max(...xs)) / 2;
      pos[id] = { x: myX, y: depth * rowH };
      return myX;
    }
    layout(rootId, 0);
    const focusSet = state.mapFocusId ? new Set(subtreeIds(state.mapFocusId)) : null;
    const maxX = Math.max(...Object.values(pos).map((p) => p.x)) + colW;
    const maxY = Math.max(...Object.values(pos).map((p) => p.y)) + 110;
    canvas.style.width = maxX + "px"; canvas.style.height = maxY + "px"; canvas.style.transform = "scale(" + state.mapZoom + ")";

    let svg = '<svg width="' + maxX + '" height="' + maxY + '" style="position:absolute;top:0;left:0;pointer-events:none;">';
    Object.keys(pos).forEach((id) => {
      const n = nodes[id];
      if (!n.parentId || !pos[n.parentId]) return;
      const a = pos[id], b = pos[n.parentId];
      svg += '<path d="M ' + (b.x + 86) + " " + (b.y + 78) + " C " + (b.x + 86) + " " + (b.y + 105) + ", " + (a.x + 86) + " " + (a.y - 27) + ", " + (a.x + 86) + " " + a.y + '" stroke="var(--border-card)" stroke-width="1.5" fill="none"/>';
    });
    svg += "</svg>";

    let blocks = "";
    Object.keys(pos).forEach((id) => {
      const n = nodes[id];
      const p = pos[id];
      const dim = focusSet ? "" : (state.mapFocusId ? " focus-dim" : "");
      blocks += '<div class="map-block' + (n.isTemporary ? " is-temp" : "") + (n.status === "archived" ? " is-archived" : "") + (state.selectedId === id ? " selected" : "") + dim + '" style="left:' + p.x + "px; top:" + p.y + 'px;" data-map-node="' + id + '">';
      blocks += '<div class="map-block__type">' + TYPE_LABEL[n.type] + "</div><div class=\"map-block__name\">" + escapeHtml(n.name) + "</div>";
      const noMgr = n.status !== "archived" && n.type !== "company" && !hasManager(n);
      blocks += '<div class="map-block__meta">👤 ' + nodeHeadcount(id) + (noMgr ? ' · <span style="color:var(--f-danger)">Vacant Lead</span>' : "") + "</div></div>";
    });
    canvas.innerHTML = svg + blocks;
    canvas.querySelectorAll("[data-map-node]").forEach((el) => {
      const id = el.dataset.mapNode;
      el.addEventListener("click", () => { state.selectedId = id; state.contextPanelOpen = true; renderMainContent(); });
      el.addEventListener("dblclick", () => { state.mapFocusId = id; renderMap(); });
      if (nodes[id].status !== "archived" && nodes[id].type !== "company" && currentCaps().editStructure) {
        el.draggable = true;
        el.addEventListener("dragstart", (ev) => onNodeDragStart(ev, id));
        el.addEventListener("dragend", onDragEnd);
      }
      el.addEventListener("dragover", (ev) => onRowDragOver(ev, el, id));
      el.addEventListener("dragleave", () => el.classList.remove("drop-target-active"));
      el.addEventListener("drop", (ev) => onRowDrop(ev, el, id));
    });
    document.getElementById("mapZoomLabel").textContent = Math.round(state.mapZoom * 100) + "%";
  }

  /* ---------------- Таблица (§6.3 — массовые операции, большой масштаб) ---------------- */
  function renderTableMode() {
    return '<div class="table-wrap">' +
      '<div class="table-toolbar"><input type="text" id="tableFilterInput" placeholder="Фильтр по имени, должности, отделу…" value="' + escapeAttr(state.tableFilter) + '" style="min-width:260px;"></div>' +
      '<table class="data-table"><thead><tr>' +
      '<th data-sort="name">ФИО</th><th data-sort="title">Должность</th><th data-sort="dept">Подразделение</th><th data-sort="secondary">Доп. связи</th><th data-sort="status">Статус</th>' +
      '</tr></thead><tbody id="tableBody"></tbody></table></div>';
  }

  function bindTableHandlers() {
    document.getElementById("tableFilterInput").addEventListener("input", (e) => { state.tableFilter = e.target.value; renderTableBody(); document.getElementById("tableFilterInput").focus(); });
    document.querySelectorAll("[data-sort]").forEach((th) => th.addEventListener("click", () => {
      const col = th.dataset.sort;
      if (state.tableSort.col === col) state.tableSort.dir *= -1; else state.tableSort = { col, dir: 1 };
      renderTableBody();
    }));
    renderTableBody();
  }

  function renderTableBody() {
    const tbody = document.getElementById("tableBody");
    const q = state.tableFilter.trim().toLowerCase();
    let rows = allEmployees().map((e) => {
      const primaryId = effectivePrimary(e.id);
      return {
        e, name: e.name, title: e.title || "", dept: primaryId ? nodes[primaryId].name : "Требуют назначения",
        secondary: e.secondaryNodeIds.map((id) => nodes[id].name).join(", "),
        status: (e.override && e.override.active) ? "Временный Primary" : (primaryId ? "Основное" : "Не назначен"),
      };
    });
    if (q) rows = rows.filter((r) => (r.name + " " + r.title + " " + r.dept).toLowerCase().includes(q));
    const { col, dir } = state.tableSort;
    rows.sort((a, b) => (a[col] > b[col] ? 1 : a[col] < b[col] ? -1 : 0) * dir);
    tbody.innerHTML = rows.map((r) => '<tr data-emp-id="' + r.e.id + '"><td>' + escapeHtml(r.name) + "</td><td>" + escapeHtml(r.title) + "</td><td>" + escapeHtml(r.dept) + "</td><td>" + escapeHtml(r.secondary || "—") + "</td><td>" + escapeHtml(r.status) + "</td></tr>").join("") || '<tr><td colspan="5" class="empty-note">Ничего не найдено.</td></tr>';
    tbody.querySelectorAll("[data-emp-id]").forEach((tr) => tr.addEventListener("click", () => selectStructureObject("emp:" + tr.dataset.empId)));
  }

  /* =========================================================
     10. КОНТЕКСТНАЯ ПАНЕЛЬ (§9) — не постоянная, открывается по клику.
     ========================================================= */
  function closeContextPanel() { state.contextPanelOpen = false; renderMainContent(); }

  function renderContextPanel() {
    const open = state.contextPanelOpen && state.selectedId != null;
    let body = "";
    if (open) {
      if (state.selectedId === UNASSIGNED) body = contextPanelUnassigned();
      else if (String(state.selectedId).startsWith("emp:")) body = contextPanelEmployee(state.selectedId.slice(4));
      else body = contextPanelNode(state.selectedId);
    }
    return '<div class="context-panel' + (open ? "" : " hidden-panel") + '" id="contextPanel">' +
      '<div class="context-panel__head"><span></span><button class="context-panel__close" id="contextPanelClose">×</button></div>' +
      '<div class="context-panel__body" id="contextPanelBody">' + body + "</div></div>";
  }

  function bindContextPanelHandlers() {
    const closeBtn = document.getElementById("contextPanelClose");
    if (closeBtn) closeBtn.addEventListener("click", closeContextPanel);
    if (!state.contextPanelOpen) return;
    if (state.selectedId === UNASSIGNED) bindUnassignedPanelHandlers();
    else if (String(state.selectedId).startsWith("emp:")) bindEmployeePanelHandlers(state.selectedId.slice(4));
    else bindNodePanelHandlers(state.selectedId);
  }

  function roleGatedButton(label, dataAttrs, allowed, dangerous) {
    if (!allowed) return '<button class="btn btn--sm" disabled title="Недоступно для роли «' + ROLE_LABELS[state.currentRole] + '» (' + (dangerous ? "admin-only" : "read-only") + ')">🔒 ' + label + "</button>";
    return '<button class="btn btn--sm' + (dangerous ? " btn--danger" : "") + '" ' + dataAttrs + ">" + label + "</button>";
  }

  function contextPanelNode(id) {
    const n = nodes[id];
    const manager = n.managerId ? employees[n.managerId] : null;
    const acting = n.actingManager ? employees[n.actingManager.employeeId] : null;
    const parent = n.parentId ? nodes[n.parentId] : null;
    const kids = childrenOf(id);
    const isArchived = n.status === "archived";
    const caps = currentCaps();

    let html = '<div class="chip ' + (n.isTemporary ? "chip--terra" : "chip--accent") + '">' + TYPE_LABEL[n.type] + (n.isTemporary ? " · временная" : "") + "</div>";
    html += '<div class="context-panel__title">' + escapeHtml(n.name) + "</div>";
    html += '<div style="color:var(--text-secondary);font-size:12.5px;margin-bottom:10px;">Родитель: ' + (parent ? escapeHtml(parent.name) : "—") + "</div>";
    if (!isArchived && n.type !== "company" && !hasManager(n)) html += '<div class="warn-banner danger-tone"><span>⚠</span><div><strong>Vacant Lead</strong>Нет руководителя.</div></div>';

    html += '<div class="info-grid" style="grid-template-columns:1fr 1fr;">';
    html += infoItem("Статус", isArchived ? '<span class="chip chip--outline">Архив</span>' : '<span class="chip chip--good">Активна</span>');
    html += infoItem("Руководитель", manager ? escapeHtml(manager.name) : '<span class="muted">не назначен</span>');
    html += infoItem("И.О.", acting ? escapeHtml(acting.name) : '<span class="muted">нет</span>');
    html += infoItem("Дочерних узлов", String(kids.length));
    if (n.isTemporary) html += infoItem("Период", '<span class="date-range">' + fmtDate(n.startDate) + " – " + fmtDate(n.endDate) + "</span>");
    html += "</div>";

    if (!isArchived) {
      html += '<div class="context-panel__actions">';
      html += roleGatedButton("+ Добавить сотрудника", 'data-act="addEmployee"', caps.manageEmployees);
      html += roleGatedButton("+ Дочерний узел", 'data-act="addChild"', caps.editStructure);
      if (n.type === "project") html += roleGatedButton("+ Бригада в проекте", 'data-act="addTeamInProject"', caps.editStructure);
      html += roleGatedButton("Переместить / сменить родителя", 'data-act="reparent"', caps.editStructure && n.type !== "company");
      html += roleGatedButton("Переименовать", 'data-act="rename"', caps.editStructure);
      html += roleGatedButton("Назначить руководителя", 'data-act="setManager"', caps.manageEmployees);
      html += '<div class="more-actions"><button class="btn btn--sm btn--ghost" id="moreActionsBtn">Ещё ▾</button><div class="dropdown-panel hidden" id="moreActionsDropdown">' +
        roleGatedButtonDropdown("Изменить тип", "changeType", caps.editStructure && n.type !== "company") +
        roleGatedButtonDropdown("Назначить И.О.", "setActing", caps.manageEmployees) +
        roleGatedButtonDropdown("История (журнал изменений)", "history", true) +
        (n.type !== "company" ? '<div class="dropdown-panel__divider"></div>' + roleGatedButtonDropdown("Архивировать", "archive", caps.archive, true) : "") +
        "</div></div>";
      html += "</div>";
    }

    html += '<div style="font-family:var(--font-display);font-weight:600;font-size:14px;margin:14px 0 8px;">Сотрудники (' + (employeesPrimaryAt(id).length + employeesSecondaryAt(id).length) + ")</div>";
    const primaryPeople = employeesPrimaryAt(id), secondaryPeople = employeesSecondaryAt(id);
    if (!primaryPeople.length && !secondaryPeople.length) html += '<div class="empty-note">Никто не назначен.</div>';
    primaryPeople.concat(secondaryPeople).forEach((e) => {
      html += '<div class="person-row" data-emp-id="' + e.id + '" style="margin-bottom:6px;"><div class="avatar">' + initials(e.name) + '</div><div><div class="person-row__name">' + escapeHtml(e.name) + '</div><div class="person-row__title">' + escapeHtml(e.title || "") + "</div></div></div>";
    });
